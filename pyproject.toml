[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "california-housing-ml-portfolio"
version = "0.1.0"
description = "Student regression project with a geographic train/test split"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
boosting = ["catboost>=1.2,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
