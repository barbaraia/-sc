[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-risk-portfolio"
version = "1.0.0"
description = "Reproducible churn classification, threshold optimization and FastAPI"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2", "fastapi>=0.110,<1", "uvicorn>=0.29,<1",
  "pydantic>=2,<3", "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
boosting = ["catboost>=1.2,<2"]
dev = ["pytest>=8,<10", "httpx>=0.25,<1", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
